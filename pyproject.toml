[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-goggles"
version = "0.2.0"
description = "A source-agnostic Detection-as-Code runner for defensive labs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "libport" },
]
dependencies = [
  "jsonschema>=4.23,<5",
  "packaging>=24,<27",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
ssh = [
  "ansible-core>=2.19,<2.22",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
dacctl = "detection_goggles.cli:main"
dac-askpass = "detection_goggles.target_worker:askpass"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
detection_goggles = ["ansible/*.yml", "schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests", "packs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
